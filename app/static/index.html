<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vibe Budget Agent</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16181d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --ok: #067647;
    --warn: #b45309;
    --danger: #b42318;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a; --card: #1c1f25; --ink: #e8eaed; --muted: #9aa2ad;
      --line: #2c313a; --accent: #5b8def; --ok: #4ade80; --warn: #fbbf24; --danger: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }

  .badge {
    font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); white-space: nowrap;
  }
  .badge.live { background: #fef2f2; color: #b42318; border-color: #fecaca; }
  .badge.estimate { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
  .badge.mock { background: #f3f4f6; color: #4b5563; }
  @media (prefers-color-scheme: dark) {
    .badge.live { background: #3b1513; color: #fca5a5; border-color: #7f1d1d; }
    .badge.estimate { background: #10243f; color: #93c5fd; border-color: #1e3a8a; }
    .badge.mock { background: #262a31; color: #9aa2ad; }
  }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 18px; margin-bottom: 14px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; font-weight: 600; }

  label { display: block; font-size: 13px; font-weight: 550; margin-bottom: 5px; }
  .hint { font-weight: 400; color: var(--muted); }
  input[type=text], input[type=number], textarea, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--ink); font: inherit; font-size: 14px;
  }
  textarea { resize: vertical; min-height: 62px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > .field { flex: 1 1 160px; margin-bottom: 14px; }

  .formats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; font-size: 14px;
    background: var(--bg); user-select: none;
  }
  .chip input { margin: 0; }
  .chip.on { border-color: var(--accent); color: var(--accent); font-weight: 550; }

  button {
    font: inherit; font-size: 15px; font-weight: 600; padding: 11px 18px;
    border-radius: 9px; border: 1px solid transparent; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .btn-main { background: var(--accent); color: #fff; width: 100%; }
  .btn-spend { background: var(--danger); color: #fff; width: 100%; }
  .btn-ghost { background: transparent; color: var(--muted); border-color: var(--line); }

  .total { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
  .price { font-size: 26px; font-weight: 680; letter-spacing: -0.02em; }
  .of { color: var(--muted); font-size: 14px; }
  .bar { height: 7px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 10px 0 16px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }

  .step { border-top: 1px solid var(--line); padding: 13px 0; }
  .step:first-of-type { border-top: 0; }
  .step-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .step-name { font-weight: 600; }
  .step-price { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .why { color: var(--muted); font-size: 13px; margin-top: 5px; }
  details { margin-top: 7px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details ul { margin: 7px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }

  .note { font-size: 13px; padding: 9px 12px; border-radius: 8px; margin-top: 8px; }
  .note.warn { background: rgba(180,83,9,.1); color: var(--warn); }
  .note.err  { background: rgba(180,35,24,.1); color: var(--danger); }
  .note.ok   { background: rgba(6,118,71,.1); color: var(--ok); }

  .spend-box { border: 1px solid var(--danger); border-radius: var(--radius); padding: 16px; margin-top: 16px; }
  .spend-box p { margin: 0 0 12px; font-size: 14px; }

  .status { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.run { background: var(--accent); animation: pulse 1.1s infinite; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--danger); }
  @keyframes pulse { 50% { opacity: .3; } }

  .result img, .result video { max-width: 100%; border-radius: 9px; border: 1px solid var(--line); display: block; }
  .result audio { width: 100%; }
  .result pre {
    white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 12px;
    border-radius: 8px; border: 1px solid var(--line); font-size: 13px; margin: 0;
  }
  a { color: var(--accent); }
  .money { font-variant-numeric: tabular-nums; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Vibe Budget Agent</h1>
    <span id="mode" class="badge mock">…</span>
    <span id="balance" class="badge"></span>
  </header>
  <p class="sub">Опишите продукт и назовите бюджет. Агент подберёт модели, покажет цену и объяснит выбор — списание только после вашего подтверждения.</p>

  <!-- 1. БРИФ -->
  <form id="form" class="card">
    <h2>1. Бриф</h2>

    <div class="field">
      <label for="product_name">Продукт</label>
      <input type="text" id="product_name" required maxlength="200"
             value="CRM для мастеров маникюра">
    </div>

    <div class="field">
      <label for="product_description">Что это и чем полезно</label>
      <textarea id="product_description" required maxlength="4000">Онлайн-запись клиентов, автоматические напоминания в мессенджерах и учёт расходников в одном окне. Настройка за 15 минут.</textarea>
    </div>

    <div class="row">
      <div class="field">
        <label for="target_audience">Кому продаём</label>
        <input type="text" id="target_audience" required maxlength="1000"
               value="Мастера маникюра и небольшие студии, 22–40 лет">
      </div>
      <div class="field">
        <label for="offer">Предложение</label>
        <input type="text" id="offer" required maxlength="1000"
               value="Первый месяц бесплатно">
      </div>
    </div>

    <div class="field">
      <label>Что сгенерировать</label>
      <div class="formats" id="formats"></div>
    </div>

    <div class="row">
      <div class="field">
        <label for="budget_rub">Бюджет, ₽ <span class="hint">— жёсткий потолок</span></label>
        <input type="number" id="budget_rub" min="1" step="1" value="5" required>
      </div>
      <div class="field">
        <label for="strategy">Как выбирать модели</label>
        <select id="strategy">
          <option value="cheapest">Дешевле — минимальная цена</option>
          <option value="balanced" selected>Сбалансированно</option>
          <option value="quality">Качественнее — лучшее в бюджете</option>
        </select>
      </div>
      <div class="field">
        <label for="aspect_ratio">Формат кадра</label>
        <select id="aspect_ratio">
          <option value="9:16">9:16 — вертикальный</option>
          <option value="1:1">1:1 — квадрат</option>
          <option value="16:9">16:9 — горизонтальный</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="style">Тон и стиль <span class="hint">— необязательно</span></label>
      <input type="text" id="style" maxlength="1000" value="тёплый, живой, без канцелярита">
    </div>

    <button type="submit" class="btn-main" id="planBtn">Рассчитать план — бесплатно</button>
    <div id="formError"></div>
  </form>

  <!-- 2. ПЛАН -->
  <section id="planCard" class="card hidden">
    <h2>2. План и цена</h2>
    <div id="planBody"></div>
  </section>

  <!-- 3. ИСПОЛНЕНИЕ -->
  <section id="jobCard" class="card hidden">
    <h2>3. Результат</h2>
    <div id="jobBody"></div>
  </section>

</div>

<script>
const FORMATS = [
  ["text", "Текст"], ["image", "Картинка"], ["voice", "Озвучка"],
  ["video", "Видео"], ["music", "Музыка"],
];
const TERMINAL = ["succeeded", "partial", "failed", "aborted"];

const $ = (id) => document.getElementById(id);
const rub = (n) => Number(n).toLocaleString("ru-RU", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " ₽";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let liveMode = false;
let currentPlan = null;

// --- формат-чипы ------------------------------------------------------------
$("formats").innerHTML = FORMATS.map(([v, label]) => `
  <label class="chip${v === "image" ? " on" : ""}">
    <input type="checkbox" value="${v}"${v === "image" ? " checked" : ""}>${label}
  </label>`).join("");
$("formats").addEventListener("change", (e) => {
  e.target.closest(".chip").classList.toggle("on", e.target.checked);
});

// --- режим работы -----------------------------------------------------------
async function loadMode() {
  try {
    const h = await (await fetch("/health")).json();
    liveMode = h.live_spending_enabled;
    const el = $("mode");
    el.className = "badge " + h.mode;
    el.textContent = {
      live: "● живой режим — тратятся настоящие деньги",
      estimate: "только оценки — 0 ₽",
      mock: "демо-режим — деньги не тратятся",
    }[h.mode] || h.mode;
  } catch { $("mode").textContent = "сервис недоступен"; }
}
loadMode();

function showBalance(account) {
  if (!account || account.balance_rub == null) return;
  const left = account.daily_limit_rub != null
    ? `, дневной лимит ${rub(Math.max(0, account.daily_limit_rub - (account.daily_spent_rub || 0)))}`
    : "";
  $("balance").textContent = `баланс ${rub(account.balance_rub)}${left}`;
}

// --- запросы ----------------------------------------------------------------
async function api(url, options) {
  const res = await fetch(url, options);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.message || `Ошибка ${res.status}`);
  return body;
}

// --- 1 → 2: построение плана ------------------------------------------------
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const formats = [...document.querySelectorAll("#formats input:checked")].map((i) => i.value);
  if (!formats.length) {
    $("formError").innerHTML = `<div class="note err">Выберите хотя бы один формат.</div>`;
    return;
  }
  $("formError").innerHTML = "";
  $("planBtn").disabled = true;
  $("planBtn").textContent = "Считаем цену у платформы…";
  $("jobCard").classList.add("hidden");

  try {
    currentPlan = await api("/api/v1/plans", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        product_name: $("product_name").value,
        product_description: $("product_description").value,
        target_audience: $("target_audience").value,
        offer: $("offer").value,
        formats,
        budget_rub: Number($("budget_rub").value),
        strategy: $("strategy").value,
        aspect_ratio: $("aspect_ratio").value,
        style: $("style").value,
      }),
    });
    showBalance(currentPlan.account);
    renderPlan(currentPlan);
  } catch (err) {
    $("formError").innerHTML = `<div class="note err">${esc(err.message)}</div>`;
  } finally {
    $("planBtn").disabled = false;
    $("planBtn").textContent = "Рассчитать план — бесплатно";
  }
});

function renderPlan(plan) {
  const used = plan.budget_rub ? Math.min(100, (plan.total_estimated_rub / plan.budget_rub) * 100) : 0;
  const billable = plan.steps.filter((s) => s.kind === "generation");

  let html = `
    <div class="total">
      <span class="price money">${rub(plan.total_estimated_rub)}</span>
      <span class="of">из ${rub(plan.budget_rub)} — остаётся ${rub(plan.budget_remaining_rub)}</span>
    </div>
    <div class="bar"><i style="width:${used}%"></i></div>`;

  for (const s of plan.steps) {
    const free = s.kind === "local";
    html += `
      <div class="step">
        <div class="step-head">
          <span class="step-name">${esc(s.format)}</span>
          <span class="of">${free ? "локально, бесплатно" : esc(s.model)}</span>
          <span class="step-price money">${free ? "0 ₽" : rub(s.estimated_cost_rub)}</span>
        </div>
        <div class="why">${esc(s.reason)}</div>`;
    if (s.rejected_alternatives?.length) {
      html += `<details><summary>Почему не другие модели (${s.rejected_alternatives.length})</summary><ul>`;
      for (const a of s.rejected_alternatives) html += `<li><b>${esc(a.model)}</b> — ${esc(a.reason)}</li>`;
      html += `</ul></details>`;
    }
    for (const w of s.warnings || []) html += `<div class="note warn">${esc(w)}</div>`;
    html += `</div>`;
  }

  for (const w of plan.warnings) html += `<div class="note warn">${esc(w)}</div>`;

  if (plan.status === "infeasible" || !plan.steps.length) {
    html += `<div class="note err">В этот бюджет не помещается ни один шаг. Увеличьте бюджет или выберите меньше форматов.</div>`;
  } else if (!liveMode) {
    html += `<div class="note ok">Сервис запущен без права тратить — исполнение недоступно, план справочный.</div>`;
  } else if (!billable.length) {
    html += `<div class="note ok">Все шаги бесплатные — запускайте смело.</div>
             <button class="btn-main" id="runBtn">Выполнить — 0 ₽</button>`;
  } else {
    html += `
      <div class="spend-box">
        <p><b>Дальше списываются настоящие деньги.</b> Будет оплачено не более
        <b class="money">${rub(plan.total_estimated_rub)}</b>. Перед списанием агент
        заново проверит цену: если она выросла, запуск отменится без оплаты.</p>
        <button class="btn-spend" id="runBtn">Подтверждаю — выполнить за ${rub(plan.total_estimated_rub)}</button>
      </div>`;
  }

  $("planBody").innerHTML = html;
  $("planCard").classList.remove("hidden");
  $("runBtn")?.addEventListener("click", execute);
  $("planCard").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// --- 2 → 3: исполнение ------------------------------------------------------
async function execute() {
  const btn = $("runBtn");
  btn.disabled = true;
  btn.textContent = "Отправляем…";
  $("jobCard").classList.remove("hidden");
  $("jobBody").innerHTML = `<div class="status"><span class="dot run"></span>Проверяем цену и запускаем…</div>`;

  try {
    const job = await api(`/api/v1/plans/${currentPlan.plan_id}/execute`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ confirmed: true }),
    });
    btn.textContent = "Запущено";
    await poll(job.job_id);
  } catch (err) {
    $("jobBody").innerHTML = `<div class="note err">${esc(err.message)}</div>`;
    btn.disabled = false;
    btn.textContent = "Повторить";
  }
}

async function poll(jobId) {
  const started = Date.now();
  while (Date.now() - started < 20 * 60 * 1000) {
    const job = await api(`/api/v1/jobs/${jobId}`);
    renderJob(job);
    if (TERMINAL.includes(job.status)) return;
    await new Promise((r) => setTimeout(r, 1500));
  }
}

const STATUS_TEXT = {
  queued: ["run", "В очереди — деньги ещё не тронуты"],
  running: ["run", "Генерируем…"],
  succeeded: ["ok", "Готово"],
  partial: ["bad", "Готово частично"],
  failed: ["bad", "Не получилось"],
  aborted: ["bad", "Остановлено до списания — деньги не тронуты"],
};

function renderJob(job) {
  const [dot, text] = STATUS_TEXT[job.status] || ["", job.status];
  let html = `
    <div class="status"><span class="dot ${dot}"></span><b>${text}</b></div>
    <div class="total" style="margin-top:10px">
      <span class="price money">${rub(job.actual_cost_rub)}</span>
      <span class="of">списано из плановых ${rub(job.estimated_cost_rub)} · бюджет ${rub(job.budget_rub)}</span>
    </div>`;

  for (const s of job.steps) {
    html += `<div class="step">
      <div class="step-head">
        <span class="step-name">${esc(s.format)}</span>
        <span class="of">${esc(s.model || "локально")}${s.refunded ? " · средства возвращены" : ""}</span>
        <span class="step-price money">${rub(s.actual_cost_rub)}</span>
      </div>
      <div class="result" style="margin-top:9px">${renderResult(s)}</div>
      ${s.error ? `<div class="note err">${esc(s.error)}</div>` : ""}
    </div>`;
  }
  for (const e of job.errors) html += `<div class="note err">${esc(e)}</div>`;
  for (const w of job.warnings) html += `<div class="note warn">${esc(w)}</div>`;

  $("jobBody").innerHTML = html;
}

function renderResult(step) {
  const text = step.text_output || step.local_output;
  if (text) return `<pre>${esc(text)}</pre>`;
  const url = step.display_url || step.result_url;
  if (!url) {
    return step.status === "succeeded" ? "" :
      `<span class="of">${step.status === "skipped" ? "шаг не запускался" : "ожидаем…"}</span>`;
  }
  if (step.format === "image") return `<img src="${esc(url)}" alt="результат" loading="lazy">`;
  if (step.format === "video") return `<video src="${esc(url)}" controls playsinline></video>`;
  if (step.format === "voice" || step.format === "music") return `<audio src="${esc(url)}" controls></audio>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener">Открыть результат</a>`;
}
</script>
</body>
</html>
