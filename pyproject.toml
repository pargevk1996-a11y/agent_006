[project]
name = "vibe-budget-agent"
version = "0.1.0"
description = "Cost-aware AI agent that turns a marketing brief into a budget-bounded content generation plan on top of the Vibe-Marketolog Agent API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "aiosqlite>=0.20.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Tracing is opt-in: the default install stays dependency-light, and the demo
# does not need a collector to run. See README §12.
otel = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    # Installed for tests so the tracing adapter is verified against the real SDK,
    # not only in its no-op form.
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",    # asserts are fine (tests + internal invariants)
    "RUF001",  # ambiguous unicode in Russian strings
    "RUF002",
    "RUF003",
    "B008",    # FastAPI Depends() in defaults
    "RUF012",  # pydantic model_config / json_schema_extra are class-level dicts by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"app/clients/mock.py" = ["S311"]  # deterministic pseudo-random only, never security-relevant

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
